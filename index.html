<style>
:root{
  color-scheme:light;
  --vert:#004226; --vert-clair:#A8DDA0; --vert-pale:#EDF5EE;
  --paper:#FFFFFF; --ink:#13201A; --ink-soft:#5E6B64;
  --line:#E3E7E2; --line-strong:#C8CFC8;
  --anomalie:#B3322C; --evolution:#004226; --question:#78857C;
  --flag:#B3322C; --flag-bg:#FBECEA;
  --r:4px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--vert); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* porte d'entree */
.gate{min-height:100svh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:420px;border:1px solid var(--line);border-top:3px solid var(--vert);border-radius:var(--r);padding:30px}
.gate-card .logo{height:46px;margin-bottom:26px}
.gate-card h1{font-size:19px;letter-spacing:-.01em}
.gate-card .sub{color:var(--ink-soft);font-size:14px;margin:2px 0 24px}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
input[type=text],input[type=password],textarea{width:100%;padding:9px 11px;background:#fff;color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r);font:inherit}
textarea{resize:vertical;min-height:84px}
.btn{background:var(--vert);color:#fff;border:1px solid var(--vert);border-radius:var(--r);padding:9px 16px}
.btn:hover{background:#00321d}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 16px}
.btn-ghost:hover{border-color:var(--vert);color:var(--vert)}
.btn-sm{padding:6px 12px;font-size:14px}
.demo{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft)}
.demo-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* entete */
.mastbar{border-bottom:1px solid var(--line)}
.mastbar .wrap{display:flex;align-items:center;gap:16px;padding-top:16px;padding-bottom:14px}
.mastbar .logo{height:38px}
.rule{width:1px;height:30px;background:var(--line-strong)}
.title{font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.title small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)}
.role{padding:3px 10px;border:1px solid var(--line-strong);border-radius:20px;color:var(--vert);background:var(--vert-pale)}
.linkish{background:none;border:0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:0}

/* bandeau */
.ledger{border-bottom:1px solid var(--line);background:var(--vert-pale)}
.ledger .wrap{display:flex;align-items:center;gap:30px;flex-wrap:wrap;padding-top:13px;padding-bottom:13px}
.tally{display:flex;align-items:baseline;gap:7px}
.tally b{font-size:22px;font-weight:700;line-height:1;color:var(--vert)}
.tally span{font-size:13px;color:var(--ink-soft)}
.tally.flagged b{color:var(--flag)}
.ledger .btn{margin-left:auto}

/* barre de filtres */
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:20px 0 4px}
.filt{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 13px;color:var(--ink-soft);font-size:14px}
.filt:hover{border-color:var(--line-strong)}
.filt[aria-pressed=true]{border-color:var(--vert);color:var(--vert);background:var(--vert-pale)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* tuiles */
.group{margin-top:26px}
.group h2{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;padding-bottom:9px;border-bottom:1px solid var(--line)}
.group h2 em{font-style:normal;font-weight:400;color:var(--ink-soft);margin-left:auto;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:7px;text-align:left;background:#fff;border:1px solid var(--line);
  border-top:3px solid var(--nature);border-radius:var(--r);padding:14px 15px 12px;min-height:148px}
.tile:hover{border-color:var(--line-strong);border-top-color:var(--nature);box-shadow:0 1px 0 var(--line)}
.tile .top{display:flex;align-items:center;gap:8px}
.ref{font-size:12.5px;color:var(--ink-soft);letter-spacing:.02em}
.objet{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
.excerpt{font-size:13.5px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tfoot{margin-top:auto;padding-top:9px;display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft)}
.flagpill{background:var(--flag-bg);color:var(--flag);border-radius:20px;padding:1px 9px;font-size:12px}
.closed{opacity:.6}
.closed .objet{text-decoration:line-through;text-decoration-thickness:1px}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:26px;color:var(--ink-soft);margin-top:14px}

/* detail */
.detail{padding:22px 0 80px}
.back{background:none;border:0;color:var(--ink-soft);padding:0 0 14px;text-decoration:underline;text-underline-offset:3px}
.sheet{border:1px solid var(--line);border-top:3px solid var(--nature);border-radius:var(--r);padding:24px;max-width:780px}
.sheet h1{font-size:23px;line-height:1.25;margin:7px 0 9px;letter-spacing:-.01em}
.meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft)}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--nature)}
.pair{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.pair h3{font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:4px}
.pair p{margin:0}
.shots{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.shot{position:relative;width:132px;height:84px;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:#fff;padding:0}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;top:3px;right:3px;background:rgba(255,255,255,.92);border:1px solid var(--line-strong);
  border-radius:3px;width:20px;height:20px;line-height:1;font-size:13px;display:grid;place-items:center}
.addshot{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--line-strong);background:#fff;
  border-radius:var(--r);padding:7px 12px;color:var(--ink-soft);font-size:13.5px}
.addshot:hover{border-color:var(--vert);color:var(--vert)}
.thread{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.thread h3{font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:15px}
.msg{border-left:2px solid var(--who);padding:2px 0 2px 13px;margin-bottom:17px}
.msg .by{font-size:12.5px;color:var(--ink-soft);margin-bottom:3px}
.msg .by b{color:var(--who);font-weight:600}
.msg p{margin:0}
.reply{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.actions{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap;align-items:center}
.actions .right{margin-left:auto}

/* visionneuse + modale */
.modal{position:fixed;inset:0;background:rgba(8,20,14,.5);display:grid;place-items:center;padding:20px;z-index:10}
.modal-card{width:100%;max-width:540px;max-height:86svh;overflow:auto;background:#fff;border:1px solid var(--line-strong);border-top:3px solid var(--vert);border-radius:var(--r);padding:24px}
.modal-card h2{font-size:20px;margin-bottom:18px}
.radios{display:flex;gap:7px;flex-wrap:wrap}
.radios label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:20px;padding:6px 13px;cursor:pointer;font-size:14px}
.radios input{accent-color:var(--vert)}
.check{display:flex;align-items:center;gap:9px;margin-bottom:18px;font-size:14px}
.check input{accent-color:var(--vert)}
.viewer{position:fixed;inset:0;background:rgba(8,20,14,.86);display:grid;place-items:center;padding:24px;z-index:20}
.viewer img{max-width:94vw;max-height:88svh;border-radius:var(--r)}
</style>
</head>

  <div class="field"><span>Nature</span><div class="radios">
    <label><input type="radio" name="nNature" value="anomalie"> <span class="dot" style="background:var(--anomalie)"></span>Anomalie</label>
    <label><input type="radio" name="nNature" value="evolution" checked> <span class="dot" style="background:var(--evolution)"></span>Évolution</label>

<script>
/* ================================================================
   Adresse du script Google Apps Script (deploiement /exec).
   Remplacez la valeur ci-dessous par l'URL obtenue au deploiement.
   ================================================================ */
const API="https://script.google.com/macros/s/AKfycbzwa_KvW5EEVqC0dFHdKMFSxe0QHpV21xmHhVoMDeN0x-5dwIl1uzHVD3Y4NHEGA-rf1w/exec";

const NATURES={anomalie:{label:"Anomalie",color:"var(--anomalie)"},evolution:{label:"Évolution",color:"var(--evolution)"},question:{label:"Question",color:"var(--question)"}};
let ROLE=null,CODE=null,NOM=null,FICHES=[],FILTER={nature:null,bloq:false,clos:false},OPEN=null,PENDING=[];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el=i=>document.getElementById(i);

/* ---------------- appels au script ---------------- */
async function api(action,data){
  const r=await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({action,code:CODE},data||{}))});
  const j=await r.json();
  if(!j.ok&&j.erreur==="code"){alert("Code refusé.");leave();}
  return j;
}

/* ---------------- entree ---------------- */
el("code").addEventListener("keydown",e=>{if(e.key==="Enter")enter();});
async function enter(){
  const c=el("code").value.trim();
  if(!c)return el("code").focus();
  const msg=el("gateMsg"); msg.textContent="Vérification...";
  CODE=c;
  const j=await api("auth");
  if(!j.ok){msg.textContent="Code non reconnu.";CODE=null;return;}
  ROLE=j.role;NOM=j.nom;
  try{sessionStorage.setItem("avac",c);}catch(e){}
  msg.textContent="";
  el("gate").classList.add("hidden");el("app").classList.remove("hidden");
  el("roleLabel").textContent=NOM;
  await recharger();
}
function leave(){
  CODE=ROLE=null;OPEN=null;PENDING=[];
  try{sessionStorage.removeItem("avac");}catch(e){}
  el("app").classList.add("hidden");el("gate").classList.remove("hidden");el("code").value="";
}
(function auto(){
  let c=null;try{c=sessionStorage.getItem("avac");}catch(e){}
  if(c){el("code").value=c;enter();}
})();

async function recharger(){
  el("board").innerHTML='<div class="empty">Chargement...</div>';
  const j=await api("load");
  if(!j.ok){el("board").innerHTML='<div class="empty">Connexion au suivi impossible. Réessayez dans un instant.</div>';return;}
  FICHES=j.fiches.map(f=>Object.assign(f,{bloq:f.bloq===true||f.bloq==="oui"}));
  render();
}

/* ---------------- filtres ---------------- */
function toggleNature(n){FILTER.nature=FILTER.nature===n?null:n;render();}
function toggleBloq(){FILTER.bloq=!FILTER.bloq;render();}
function toggleClos(){FILTER.clos=!FILTER.clos;render();}
function visible(){return FICHES.filter(f=>{
  if(!FILTER.clos&&f.statut==="cloturee")return false;
  if(FILTER.nature&&f.nature!==FILTER.nature)return false;
  if(FILTER.bloq&&!f.bloq)return false;return true;});}

/* ---------------- tableau ---------------- */
function render(){
  const ouvertes=FICHES.filter(f=>f.statut==="ouverte"),bloq=ouvertes.filter(f=>f.bloq).length;
  el("ledger").innerHTML=`<div class="tally"><b>${ouvertes.length}</b><span>fiches ouvertes</span></div>`+
    `<div class="tally ${bloq?"flagged":""}"><b>${bloq}</b><span>bloquantes</span></div>`+
    (ROLE==="cabinet"?`<button class="btn btn-sm" onclick="openNew()">Nouvelle fiche</button>`:"");
  el("tools").innerHTML=Object.entries(NATURES).map(([k,v])=>{
    const n=FICHES.filter(f=>f.nature===k&&(FILTER.clos||f.statut==="ouverte")).length;
    return `<button class="filt" aria-pressed="${FILTER.nature===k}" onclick="toggleNature('${k}')">
      <span class="dot" style="background:${v.color}"></span>${v.label} ${n}</button>`;}).join("")
    +`<button class="filt" aria-pressed="${FILTER.bloq}" onclick="toggleBloq()">Bloquantes</button>`
    +`<button class="filt" aria-pressed="${FILTER.clos}" onclick="toggleClos()">Clôturées</button>`;
  const v=visible();
  el("board").innerHTML=v.length?Object.entries(NATURES).map(([k,nat])=>{
    const g=v.filter(f=>f.nature===k);if(!g.length)return"";
    g.sort((a,b)=>(b.bloq?1:0)-(a.bloq?1:0));
    return `<section class="group"><h2><span class="dot" style="background:${nat.color}"></span>${nat.label}
      <em>${g.length>1?g.length+" fiches":"1 fiche"}</em></h2>
      <div class="grid">${g.map(tile).join("")}</div></section>`;}).join("")
    :`<div class="empty">Aucune fiche ne correspond à ce filtre.</div>`;
}
function tile(f){
  const n=NATURES[f.nature],img=f.shots.length+f.msgs.reduce((s,m)=>s+m.shots.length,0);
  return `<button class="tile ${f.statut==="cloturee"?"closed":""}" style="--nature:${n.color}" onclick="openFiche('${f.id}')">
    <div class="top"><span class="ref">${f.id}</span>${f.bloq?'<span class="flagpill">Bloquant</span>':''}</div>
    <div class="objet">${esc(f.objet)}</div>
    <div class="excerpt">${esc(f.constate)}</div>
    <div class="tfoot"><span>${f.msgs.length?f.msgs.length+(f.msgs.length>1?" messages":" message"):"Pas de réponse"}</span>
      ${img?`<span>${img} capture${img>1?"s":""}</span>`:""}
      <span>${f.statut==="cloturee"?"Clôturée":f.date}</span></div></button>`;
}

/* ---------------- fiche ---------------- */
function shotStrip(list,cible,mid,ouverte){
  return `<div class="shots">${list.map(s=>`<span class="shot"><img src="${s.url}" alt="" loading="lazy" onclick="zoom('${s.url}')">
    ${ouverte?`<button class="x" title="Supprimer" onclick="delShot(event,'${cible}','${mid}','${s.fid}')">×</button>`:""}</span>`).join("")}
    ${ouverte?`<button class="addshot" onclick="pick('${cible}','${mid}')">Ajouter une capture</button>`:""}</div>`;
}
function openFiche(id){
  OPEN=id;PENDING=[];
  const f=FICHES.find(x=>x.id===id),n=NATURES[f.nature],ouv=f.statut==="ouverte";
  const peutSupprimer=m=>ouv&&(ROLE==="cabinet"||m.who===ROLE);
  const msgs=f.msgs.map(m=>`<div class="msg" style="--who:${m.who==="cabinet"?"var(--vert)":"#2B5A86"}">
      <div class="by"><b>${esc(m.nom)}</b> &nbsp;${m.date}</div><p>${esc(m.txt)}</p>
      ${m.shots.length?shotStrip(m.shots,"message",m.mid,peutSupprimer(m)):""}</div>`).join("")
    ||`<p style="color:var(--ink-soft);margin:0">Aucun échange pour l'instant.</p>`;
  el("detailView").innerHTML=`
    <button class="back" onclick="showBoard()">Retour au tableau</button>
    <article class="sheet" style="--nature:${n.color}">
      <div style="display:flex;gap:9px;align-items:center">
        <span class="ref">${f.id}</span>${f.bloq?'<span class="flagpill">Bloquant</span>':''}</div>
      <h1>${esc(f.objet)}</h1>
      <div class="meta"><span class="tag" style="--nature:${n.color}"><span class="dot" style="background:${n.color}"></span>${n.label}</span>
        <span>${ouv?"Ouverte depuis le "+f.date:"Clôturée"}</span></div>
      <div class="pair"><h3>Comportement constaté</h3><p>${esc(f.constate)}</p></div>
      <div class="pair"><h3>Comportement attendu</h3><p>${esc(f.attendu)}</p>
        ${shotStrip(f.shots,"fiche",f.id,ouv&&ROLE==="cabinet")}</div>
      <div class="thread"><h3>Échanges</h3>${msgs}
        ${ouv?`<div class="reply">
          <textarea id="replyBox" placeholder="Votre réponse" onpaste="pasteShot(event)"></textarea>
          <div class="shots" id="pendingShots"></div>
          <div class="actions"><button class="btn" id="sendBtn" onclick="reply()">Envoyer</button>
            <button class="btn-ghost" onclick="pick('pending','')">Joindre une capture</button>
            ${ROLE==="cabinet"?`<button class="btn-ghost right" onclick="closeFiche()">Clôturer la fiche</button>`:""}
          </div></div>`:(ROLE==="cabinet"?`<div class="actions"><button class="btn-ghost" onclick="rouvrir()">Rouvrir la fiche</button></div>`:"")}
      </div></article>`;
  renderPending();
  el("boardView").classList.add("hidden");el("detailView").classList.remove("hidden");window.scrollTo(0,0);
}
function showBoard(){el("detailView").classList.add("hidden");el("boardView").classList.remove("hidden");OPEN=null;PENDING=[];render();}

/* ---------------- captures ---------------- */
let target=null;
function pick(cible,mid){target={cible,mid};el("picker").click();}
el("picker").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,d=>place(d));e.target.value="";};
function pasteShot(e){const it=[...e.clipboardData.items].find(i=>i.type.startsWith("image/"));
  if(it){e.preventDefault();target={cible:"pending",mid:""};shrink(it.getAsFile(),d=>place(d));}}
function shrink(file,cb){const img=new Image();img.onload=()=>{
  const s=Math.min(1,1600/img.width),c=document.createElement("canvas");
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.82));};
  img.src=URL.createObjectURL(file);}
async function place(d){
  if(target.cible==="pending"){PENDING.push(d);renderPending();return;}
  const j=await api("image.add",{cible:target.cible,id:OPEN,mid:target.mid,data:d});
  if(!j.ok)return alert("Dépôt impossible.");
  const f=FICHES.find(x=>x.id===OPEN);
  if(target.cible==="fiche")f.shots.push({fid:j.fid,url:j.url});
  else f.msgs.find(m=>m.mid===target.mid).shots.push({fid:j.fid,url:j.url});
  openFiche(OPEN);
}
function renderPending(){const z=el("pendingShots");if(!z)return;
  z.innerHTML=PENDING.map((s,i)=>`<span class="shot"><img src="${s}" alt="" onclick="zoom('${s}')">
    <button class="x" onclick="PENDING.splice(${i},1);renderPending()">×</button></span>`).join("");}
function zoom(src){el("viewerImg").src=src;el("viewer").classList.remove("hidden");}
async function delShot(ev,cible,mid,fid){
  ev.stopPropagation();
  const j=await api("image.delete",{cible,id:OPEN,mid,fid});
  if(!j.ok)return alert("Suppression impossible.");
  const f=FICHES.find(x=>x.id===OPEN);
  if(cible==="fiche")f.shots=f.shots.filter(s=>s.fid!==fid);
  else{const m=f.msgs.find(m=>m.mid===mid);m.shots=m.shots.filter(s=>s.fid!==fid);}
  openFiche(OPEN);
}

/* ---------------- messages ---------------- */
async function reply(){
  const box=el("replyBox"),txt=box.value.trim();
  if(!txt&&!PENDING.length)return box.focus();
  const b=el("sendBtn");b.disabled=true;b.textContent="Envoi...";
  const j=await api("message.add",{id:OPEN,txt:txt||"Capture jointe."});
  if(!j.ok){b.disabled=false;b.textContent="Envoyer";return alert("Envoi impossible.");}
  const f=FICHES.find(x=>x.id===OPEN),m={mid:j.mid,who:ROLE,nom:NOM,date:"à l'instant",txt:txt||"Capture jointe.",shots:[]};
  f.msgs.push(m);
  for(const d of PENDING){
    const r=await api("image.add",{cible:"message",id:OPEN,mid:j.mid,data:d});
    if(r.ok)m.shots.push({fid:r.fid,url:r.url});
  }
  PENDING=[];openFiche(OPEN);
}
async function closeFiche(){
  if(!confirm("Clôturer cette fiche ?"))return;
  const j=await api("fiche.close",{id:OPEN});
  if(!j.ok)return alert("Clôture impossible.");
  FICHES.find(x=>x.id===OPEN).statut="cloturee";showBoard();
}
async function rouvrir(){
  const j=await api("fiche.close",{id:OPEN,rouvrir:true});
  if(!j.ok)return alert("Réouverture impossible.");
  FICHES.find(x=>x.id===OPEN).statut="ouverte";openFiche(OPEN);
}

/* ---------------- nouvelle fiche ---------------- */
function openNew(){el("modal").classList.remove("hidden");el("nObjet").focus();}
function closeNew(){el("modal").classList.add("hidden");}
async function createFiche(){
  const objet=el("nObjet").value.trim();if(!objet)return el("nObjet").focus();
  const j=await api("fiche.create",{objet,nature:document.querySelector("input[name=nNature]:checked").value,
    bloq:el("nBloq").checked,constate:el("nConst").value.trim(),attendu:el("nAtt").value.trim()});
  if(!j.ok)return alert("Création impossible.");
  el("nObjet").value=el("nConst").value=el("nAtt").value="";el("nBloq").checked=false;
  closeNew();await recharger();
}
</script>
